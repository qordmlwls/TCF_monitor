name: Edmonton Apps Script Tests

on:
  push:
    paths:
      - "apps-script/edmonton/**"
      - ".github/workflows/apps-script-tests.yml"
  pull_request:
    paths:
      - "apps-script/edmonton/**"
      - ".github/workflows/apps-script-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps-script/edmonton
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - name: Verify committed deployment bundle
        run: git diff --exit-code -- dist/
